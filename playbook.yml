---
- name: Practica de Automatizacion de Servidores
  hosts: servidores
  become: yes

  tasks:
    - name: Actualizar la cache de APT y todos los paquetes del sistema
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Crear el usuario 'itla' en cada servidor
      user:
        name: itla
        state: present
        shell: /bin/bash

    - name: Crear la carpeta '/app'
      file:
        path: /app
        state: directory
        mode: '0755'
        owner: itla
        group: itla

    - name: Crear el archivo 'hola.txt' dentro de la carpeta '/app'
      copy:
        dest: /app/hola.txt
        content: |
          Hola Mundo!
          Servidor configurado exitosamente via Ansible.
        mode: '0644'
        owner: itla
        group: itla

    - name: Instalar las aplicaciones 'cowsay' y 'htop'
      apt:
        name:
          - cowsay
          - htop
        state: present